<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MJ Representações</title>
  <style>
    * {margin:0; padding:0; box-sizing:border-box; font-family:Arial, sans-serif;}
    body {background:#F2EFE4; padding:15px; max-width:600px; margin:0 auto;}
    h1 {color:#B8860B; text-align:center; margin-bottom:20px;}
    .card {background:white; padding:20px; border-radius:12px; margin-bottom:20px; box-shadow:0 2px 8px rgba(0,0,0,0.1);}
    input {width:100%; padding:12px; margin:8px 0 15px 0; border:1px solid #ddd; border-radius:8px; font-size:16px;}
    button {width:100%; padding:14px; border:none; border-radius:8px; font-size:17px; font-weight:bold; cursor:pointer; margin:5px 0;}
    .btn-salvar {background:#B8860B; color:white;}
    .btn-salvar:hover {background:#996E00;}
    .btn-whats {background:#25D366; color:white; margin-top:10px;}
    .foto-area {border:2px dashed #ccc; border-radius:10px; padding:30px; text-align:center; cursor:pointer; margin-bottom:15px;}
    .foto-area.cheia {border-color:#B8860B; background:#FFF8DC;}
    .preview {max-width:100%; max-height:250px; border-radius:8px; margin-top:10px; display:none;}
    .cliente-item {border-bottom:1px solid #eee; padding:15px 0;}
    .cliente-item:last-child {border:none;}
    .status-pago {color:green; font-weight:bold;}
    .status-vencido {color:red; font-weight:bold;}
    label {font-weight:bold; color:#333;}
    .vazio {text-align:center; color:#888; padding:20px;}
  </style>
</head>
<body>

<h1>🏪 MJ Representações</h1>

<!-- FORMULÁRIO -->
<div class="card">
  <h2>📝 Cadastrar Cliente</h2>
  
  <!-- ÁREA DA FOTO -->
  <div class="foto-area" id="fotoArea" onclick="document.getElementById('inputFoto').click()">
    <p>📷 Clique para escolher a foto da nota</p>
    <input type="file" id="inputFoto" accept="image/*" style="display:none;" onchange="carregarFoto(event)">
    <img id="previewFoto" class="preview" alt="Prévia da nota">
  </div>

  <label>Nome *</label>
  <input type="text" id="nome" placeholder="Nome do cliente">

  <label>Telefone (WhatsApp) *</label>
  <input type="tel" id="telefone" placeholder="(31) 99999-9999">

  <label>Cidade *</label>
  <input type="text" id="cidade" placeholder="Cidade">

  <label>Valor R$ *</label>
  <input type="text" id="valor" placeholder="0,00">

  <label>Vencimento *</label>
  <input type="date" id="vencimento">

  <label>Nº Nota</label>
  <input type="text" id="nota" placeholder="Número da nota">

  <button class="btn-salvar" onclick="salvarCliente()">✅ SALVAR CLIENTE</button>
</div>

<!-- LISTA DE CLIENTES -->
<div class="card">
  <h2>📋 Clientes Cadastrados</h2>
  <div id="listaClientes"></div>
</div>

<script>
let clientes = [];
let fotoBase64 = null;

// Carregar dados ao abrir
window.onload = function() {
  carregarDados();
  atualizarLista();
};

// 📷 Carregar foto
function carregarFoto(event) {
  const arquivo = event.target.files[0];
  if (!arquivo) return;

  const leitor = new FileReader();
  leitor.onload = function(e) {
    fotoBase64 = e.target.result;
    const preview = document.getElementById('previewFoto');
    preview.src = fotoBase64;
    preview.style.display = 'block';
    document.getElementById('fotoArea').classList.add('cheia');
    document.getElementById('fotoArea').innerHTML = '<p>✅ Foto carregada!</p><img id="previewFoto" class="preview" src="'+fotoBase64+'" alt="Prévia">';
  };
  leitor.readAsDataURL(arquivo);
}

// 💾 Salvar cliente
function salvarCliente() {
  const nome = document.getElementById('nome').value.trim();
  const telefone = document.getElementById('telefone').value.trim();
  const cidade = document.getElementById('cidade').value.trim();
  const valor = document.getElementById('valor').value.trim();
  const vencimento = document.getElementById('vencimento').value;
  const nota = document.getElementById('nota').value.trim();

  if (!nome || !telefone || !cidade || !valor || !vencimento) {
    alert('⚠️ Preencha TODOS os campos obrigatórios!');
    return;
  }

  const cliente = {
    id: Date.now(),
    nome,
    telefone,
    cidade,
    valor,
    vencimento,
    nota,
    foto: fotoBase64,
    pago: false
  };

  clientes.unshift(cliente);
  salvarDados();
  atualizarLista();
  limparFormulario();
  alert('✅ Cliente SALVO com sucesso!');
}

// 📋 Atualizar lista
function atualizarLista() {
  const lista = document.getElementById('listaClientes');
  
  if (clientes.length === 0) {
    lista.innerHTML = '<p class="vazio">Nenhum cliente cadastrado ainda.</p>';
    return;
  }

  lista.innerHTML = clientes.map(c => {
    const hoje = new Date();
    hoje.setHours(0,0,0,0);
    const vencto = new Date(c.vencimento + 'T00:00:00');
    const dias = Math.ceil((vencto - hoje) / (1000*60*60*24));
    let status = '';
    if (c.pago) status = '<span class="status-pago">✅ PAGO</span>';
    else if (dias < 0) status = '<span class="status-vencido">⚠️ VENCIDO</span>';
    else if (dias === 0) status = '<span style="color:orange; font-weight:bold;">📅 VENCE HOJE</span>';
    else status = <span style="color:#B8860B;">⏰ ${dias} dias</span>;

    const telLimpo = c.telefone.replace(/\D/g, '');
    const temFoto = c.foto ? '📷' : '';

    return `
      <div class="cliente-item">
        <h3>${c.nome} ${temFoto} ${status}</h3>
        <p>📞 ${c.telefone}</p>
        <p>📍 ${c.cidade}</p>
        <p>💰 R$ ${c.valor} • Venc: ${formatarData(c.vencimento)}</p>
        ${c.nota ? <p>📄 Nota: ${c.nota}</p> : ''}
        ${c.foto ? <img src="${c.foto}" style="max-width:100%; max-height:150px; border-radius:8px; margin-top:8px;"> : ''}
        <div style="display:flex; gap:8px; margin-top:10px;">
          <a href="https://wa.me/55${telLimpo}" target="_blank" style="flex:1; padding:10px; background:#25D366; color:white; text-align:center; border-radius:8px; text-decoration:none; font-weight:bold;">💬 WhatsApp</a>
          ${!c.pago ? <button onclick="marcarPago(${c.id})" style="flex:1; padding:10px; background:#2F855A; color:white; border-radius:8px; font-weight:bold;">✓ Pago</button> : ''}
        </div>
      </div>
    `;
  }).join('');
}

// 📅 Formatar data
function formatarData(data) {
  if (!data) return '';
  const [ano, mes, dia] = data.split('-');
  return ${dia}/${mes}/${ano};
}

// ✅ Marcar como pago
function marcarPago(id) {
  if (!confirm('Marcar como PAGO?')) return;
  const cli = clientes.find(c => c.id === id);
  if (cli) {
    cli.pago = true;
    salvarDados();
    atualizarLista();
  }
}

// 🧹 Limpar formulário
function limparFormulario() {
  document.getElementById('nome').value = '';
  document.getElementById('telefone').value = '';
  document.getElementById('cidade').value = '';
  document.getElementById('valor').value = '';
  document.getElementById('vencimento').value = '';
  document.getElementById('nota').value = '';
  fotoBase64 = null;
  document.getElementById('previewFoto').style.display = 'none';
  document.getElementById('fotoArea').classList.remove('cheia');
  document.getElementById('fotoArea').innerHTML = '<p>📷 Clique para escolher a foto da nota</p><input type="file" id="inputFoto" accept="image/*" style="display:none;" onchange="carregarFoto(event)">';
}

// 💾 Salvar no celular
function salvarDados() {
  localStorage.setItem('mj_clientes', JSON.stringify(clientes));
}

// 📂 Carregar do celular
function carregarDados() {
  const dados = localStorage.getItem('mj_clientes');
  if (dados) clientes = JSON.parse(dados);
}
</script>

</body>
</html>
